<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>C4 Timer — Versão Imersiva</title>
<style>
  :root{
    --card-bg: rgba(6,6,8,0.86);
    --accent:#e23b3b;
    --ok:#3be28f;
    --text:#f3f3f5;
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial; background:#000;}
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: url("c4_bg_mobile.png");
    background-size: cover;
    background-position: center;
    filter: brightness(0.5) contrast(1.02);
    z-index: -2;
  }
  body::after{
    content:""; position:fixed; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.60), rgba(0,0,0,0.72));
    z-index:-1;
  }

  .wrap{min-height:100%; display:flex; align-items:center; justify-content:center; padding:18px; box-sizing:border-box;}
  .card{width:100%;max-width:420px;background:var(--card-bg); border-radius:18px; padding:18px; box-shadow:0 12px 36px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.04);}
  h1{margin:0 0 8px; font-size:20px; text-align:center;}
  .timer-display{font-size:56px; font-weight:800; text-align:center; margin:12px 0; letter-spacing:2px; color:var(--text); text-shadow:0 6px 18px rgba(0,0,0,0.6);}
  .controls{display:flex; gap:8px; margin:10px 0;}
  input[type=number]{flex:1; padding:12px; border-radius:10px; border:1px solid #222; background:#080808; color:var(--text); font-size:16px; text-align:center;}
  button{padding:12px 14px; border-radius:10px; border:0; font-size:16px; font-weight:700; touch-action:manipulation; cursor:pointer;}
  .btn-start{background:linear-gradient(90deg,#2db7ff,#3bb0e2); color:#04121a; flex:1;}
  .btn-defuse{background:linear-gradient(90deg,#f3b138,#ff8b38); color:#1b0b00; flex:1;}
  .status{margin-top:8px; text-align:center; font-size:14px; color:#d6d6d6;}
  .mini-game{display:none; margin-top:16px; padding:12px; background:rgba(10,10,10,0.6); border-radius:12px; overflow:hidden;}
  .mini-instr{font-size:13px; margin-bottom:8px; text-align:center;color:#ddd;}
  .slider-wrap{position:relative; height:72px; display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none;}
  .track{width:100%; height:18px; background:#1b1b1d; border-radius:12px; position:relative; overflow:visible; border:1px solid rgba(255,255,255,0.03);}
  .target{position:absolute; top:-10px; height:38px; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; font-weight:700; color:#041;}
  .knob{position:absolute; top:50%; transform:translate(-50%,-50%); width:52px; height:52px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; color:white; box-shadow:0 8px 26px rgba(0,0,0,0.6); touch-action:none;}
  .mini-msg{margin-top:10px; text-align:center; font-size:15px; color:#e9e9e9; font-weight:700;}
  .defused{display:none; padding:14px; border-radius:12px; background:#08321b; color:var(--ok); text-align:center; margin-top:12px;}
  .game-over{display:none; position:fixed; inset:0; background:white; z-index:60; align-items:center; justify-content:center; flex-direction:column;}
  .game-over h2{color:#000; font-size:48px; margin:0; letter-spacing:6px;}
  footer{margin-top:12px; font-size:12px; text-align:center; color:#d0d0d0;}

  .flash {
    animation: flashAnim 0.6s ease-in-out forwards;
  }
  @keyframes flashAnim {
    0% { background: transparent; }
    10% { background: rgba(255,255,255,0.95); }
    100% { background: rgba(255,255,255,0.95); }
  }

  @media (max-width:420px){ .timer-display{font-size:48px;} .knob{width:46px;height:46px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" role="application" aria-label="C4 timer mini game">
    <h1>C4 — Defuse Game (imersivo)</h1>
    <div style="display:flex;gap:8px;">
      <input id="timeInput" type="number" min="10" max="3600" value="60" aria-label="Tempo em segundos" />
    </div>

    <div class="timer-display" id="timer">01:00</div>

    <div class="controls">
      <button id="startBtn" class="btn-start">Start</button>
      <button id="defuseBtn" class="btn-defuse" disabled>Defuse</button>
    </div>

    <div class="status" id="status">Pronto</div>

    <div class="mini-game" id="miniGame" aria-hidden="true">
      <div class="mini-instr">Mantenha o botão dentro da zona verde por <strong>5s</strong> para desarmar.</div>
      <div class="slider-wrap">
        <div class="track" id="track">
          <div class="target" id="target" style="left:30%; width:16%; background: rgba(50,210,110,0.12); border:2px solid rgba(50,210,110,0.32);">
            <span style="font-size:12px;color:#e0ffe7;">SAFE</span>
          </div>
          <div class="knob" id="knob" style="left:10%;">▮</div>
        </div>
      </div>
      <div class="mini-msg" id="miniMsg">Segure na zona: 0.0s</div>
    </div>

    <div class="defused" id="defusedBox">Bomba desarmada! ✅</div>

    <footer>Toque <strong>Start</strong>, depois <strong>Defuse</strong>.</footer>
  </div>
</div>

<div class="game-over" id="gameOver">
  <h2>GAME OVER</h2>
  <p style="color:#222; font-weight:700">A bomba explodiu</p>
</div>

<script>
/* ===== Audio Context & explosion buffer (external file) ===== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();
let explosionBuffer = null;

// 🔊 tenta carregar o som externo explosao_real.mp3
fetch("explosao.mp3")
  .then(r => {
    if (!r.ok) throw new Error('Arquivo não encontrado');
    return r.arrayBuffer();
  })
  .then(ab => audioCtx.decodeAudioData(ab))
  .then(buf => { explosionBuffer = buf; })
  .catch(() => { 
    explosionBuffer = null; // fallback será usado se não encontrar o som
  });

// 💥 Função para tocar o som da explosão
function playExplosionSound() {
  if (explosionBuffer) {
    // toca o som carregado do arquivo
    const src = audioCtx.createBufferSource();
    src.buffer = explosionBuffer;
    const gain = audioCtx.createGain();
    gain.gain.value = 1.0; // volume máximo
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();
  } else {
    // fallback sintético se o arquivo não existir
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sawtooth";
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.5);
  }
}

/* ===== improved synthetic explosion (if no file) ===== */
function makeNoiseBuffer(duration=1.0){
  const sr = audioCtx.sampleRate;
  const len = Math.floor(sr*duration);
  const buf = audioCtx.createBuffer(1,len,sr);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++){
    d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
  }
  return buf;
}
function playBigExplosion(){
  const noiseBuf = makeNoiseBuffer(1.0);
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuf;
  const g = audioCtx.createGain();
  g.gain.value = 1.2;
  src.connect(g);
  // low thud oscillator
  const sub = audioCtx.createOscillator();
  sub.type = 'sine';
  sub.frequency.value = 60;
  const subGain = audioCtx.createGain();
  subGain.gain.value = 0.0001;
  sub.connect(subGain);
  subGain.connect(g);
  g.connect(audioCtx.destination);
  src.start();
  sub.start();
  // ramps
  subGain.gain.linearRampToValueAtTime(0.9, audioCtx.currentTime + 0.02);
  subGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.0);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.1);
  src.stop(audioCtx.currentTime + 1.0);
  sub.stop(audioCtx.currentTime + 1.05);
}

/* ===== beep (fino) that accelerates in last 10s ===== */
function playTick(freq=900, dur=0.08){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine'; // thinner tone
  o.frequency.value = Math.max(400, freq);
  g.gain.value = 0.0001;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
  o.stop(audioCtx.currentTime + dur + 0.01);
}

/* ===== defuse hold sound (hum + clicks) ===== */
let defuseClickInterval = null;
let defuseHumOsc = null;
function startDefuseSound(){
  if (defuseHumOsc) return;
  defuseHumOsc = audioCtx.createOscillator();
  defuseHumOsc.type = 'sawtooth';
  defuseHumOsc.frequency.value = 170;
  const humGain = audioCtx.createGain();
  humGain.gain.value = 0.0001;
  defuseHumOsc.connect(humGain);
  humGain.connect(audioCtx.destination);
  defuseHumOsc.start();
  humGain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.12);

  defuseClickInterval = setInterval(()=> {
    const o = audioCtx.createOscillator();
    o.type = 'square';
    o.frequency.value = 1200;
    const g = audioCtx.createGain();
    g.gain.value = 0.0001;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);
    o.stop(audioCtx.currentTime + 0.07);
  }, 220);
}
function stopDefuseSound(){
  if (defuseClickInterval){ clearInterval(defuseClickInterval); defuseClickInterval = null; }
  if (defuseHumOsc){
    try { defuseHumOsc.stop(); } catch(e){}
    defuseHumOsc = null;
  }
}

/* ===== success chime ===== */
function playSuccess(){
  const now = audioCtx.currentTime;
  [880,1320,1760].forEach((n,i)=>{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = n;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.value = 0.0001;
    o.start(now + i*0.08);
    g.gain.exponentialRampToValueAtTime(0.18, now + i*0.08 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.08 + 0.26);
    o.stop(now + i*0.08 + 0.27);
  });
}

/* ===== UI & Timer & Mini-game (working defuse) ===== */
const timeInput = document.getElementById('timeInput');
const timerEl = document.getElementById('timer');
const startBtn = document.getElementById('startBtn');
const defuseBtn = document.getElementById('defuseBtn');
const statusEl = document.getElementById('status');
const miniGame = document.getElementById('miniGame');
const defusedBox = document.getElementById('defusedBox');
const gameOverEl = document.getElementById('gameOver');
const track = document.getElementById('track');
const target = document.getElementById('target');
const knob = document.getElementById('knob');
const miniMsg = document.getElementById('miniMsg');

let totalSeconds = Number(timeInput.value) || 60;
let remaining = totalSeconds;
let intervalId = null;
let running = false;
let defused = false;

/* formatting */
function formatTime(s){ s = Math.max(0, Math.floor(s)); const mm = Math.floor(s/60); const ss = s%60; return String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0'); }
function updateTimerUI(){ timerEl.textContent = formatTime(remaining); timerEl.style.color = remaining<=10 ? '#ffb3a6' : '#f3f3f5'; }

/* timer start/stop */
function startTimer(){
  if (running) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  totalSeconds = Math.max(5, Number(timeInput.value) || 60);
  remaining = totalSeconds;
  updateTimerUI();
  running = true;
  defused = false;
  defusedBox.style.display = 'none';
  statusEl.textContent = 'Contando...';
  defuseBtn.disabled = false;
  startBtn.disabled = true;
  timeInput.disabled = true;

  const startAt = Date.now();
  // tick every 100ms for smoothness and beep timing
  intervalId = setInterval(()=>{
    const elapsed = (Date.now() - startAt)/1000;
    remaining = Math.max(0, totalSeconds - elapsed);
    updateTimerUI();

    // play tick on (approx) whole seconds
    const remInt = Math.ceil(remaining);
    if (Math.abs(remaining - remInt) < 0.11){
      // compute frequency and rate
      let freq = 700;
      if (remaining <= 10){
        freq = 900 + (10 - remaining) * 80; // increases toward end
      } else {
        // slight rising with progress
        const prog = Math.max(0, (totalSeconds - remaining) / totalSeconds);
        freq = 700 + prog * 200;
      }
      playTick(freq);
    }

    // speed up mini-game target when low time
    if (remaining <= 20) baseTargetSpeed = 0.016; else baseTargetSpeed = 0.009;

    if (remaining <= 0.001){
      clearInterval(intervalId); intervalId = null;
      running = false;
      explode();
    }
  }, 100);
}
function stopTimer(){
  if (intervalId) { clearInterval(intervalId); intervalId = null; }
  running = false;
  startBtn.disabled = false;
  timeInput.disabled = false;
}

/* explosion behavior */
function explode(){
  statusEl.textContent = 'EXPLODED';
  document.body.classList.add('flash');
  setTimeout(()=> gameOverEl.style.display = 'flex', 130);
  playExplosionSound();
  stopDefuseSound();
  if (navigator.vibrate) navigator.vibrate([300,120,300]);
  defuseBtn.disabled = true;
  startBtn.disabled = false;
  timeInput.disabled = false;
}

/* defuse success */
function defuseSuccess(){
  defused = true;
  stopTimer();
  stopDefuseSound();
  statusEl.textContent = 'DESARMADA';
  defusedBox.style.display = 'block';
  miniGame.style.display = 'none';
  defuseBtn.disabled = true;
  playSuccess();
  if (navigator.vibrate) navigator.vibrate(120);
}

/* ===== Mini-game implementation (working) ===== */
let dragging = false;
let knobPos = 0.12; // 0..1
let holdTimer = 0;
let holdInterval = null;

// target movement params (baseTargetSpeed may change based on time)
let targetPos = 0.3;
let targetWidth = 0.16;
let baseTargetSpeed = 0.009;
let targetSpeed = baseTargetSpeed;
let targetDirection = 1;
const moveTickMs = 40;
let movementInterval = null;

function showMiniGame(){
  if (!running) { statusEl.textContent = 'Inicie o timer primeiro.'; return; }
  miniGame.style.display = 'block';
  miniGame.setAttribute('aria-hidden','false');

  // randomize target
  targetPos = 0.22 + Math.random()*0.56;
  targetWidth = 0.12 + Math.random()*0.12;
  if (targetPos + targetWidth > 0.95) targetPos = 0.95 - targetWidth;
  if (targetPos < 0.05) targetPos = 0.05;
  updateTargetUI();

  knobPos = 0.10;
  setKnobByPercent(knobPos);

  holdTimer = 0;
  miniMsg.textContent = 'Segure na zona: 0.0s';
  if (holdInterval) clearInterval(holdInterval);
  holdInterval = setInterval(()=> checkHold(), 80);
  startTargetMovement();
}

function hideMiniGame(){
  miniGame.style.display = 'none';
  miniGame.setAttribute('aria-hidden','true');
  if (holdInterval){ clearInterval(holdInterval); holdInterval = null; }
  stopTargetMovement();
  stopDefuseSound();
}

function updateTargetUI(){
  target.style.left = (targetPos*100) + '%';
  target.style.width = (targetWidth*100) + '%';
}

function setKnobByPercent(p){
  p = Math.max(0, Math.min(1, p));
  knobPos = p;
  knob.style.left = (p*100) + '%';
}

function percentBounds(el){
  const r = el.getBoundingClientRect();
  return { left: r.left, width: r.width };
}
function pointToPercent(pageX){
  const b = percentBounds(track);
  const x = pageX - b.left;
  let p = x / b.width;
  return Math.max(0, Math.min(1, p));
}

function checkHold(){
  const tLeft = targetPos;
  const tRight = targetPos + targetWidth;
  if (knobPos >= tLeft && knobPos <= tRight){
    holdTimer += 0.08;
    miniMsg.textContent = 'Segure na zona: ' + holdTimer.toFixed(1) + 's';
    // start defuse sound if not playing
    if (!defuseClickInterval && !defuseHumOsc) startDefuseSound();
    if (holdTimer >= 5.0){
      hideMiniGame();
      defuseSuccess();
    }
  } else {
    if (holdTimer > 0) holdTimer = Math.max(0, holdTimer - 0.18);
    miniMsg.textContent = 'Segure na zona: ' + holdTimer.toFixed(1) + 's';
    if (defuseClickInterval || defuseHumOsc) stopDefuseSound();
  }
}

/* target movement loop */
function startTargetMovement(){
  stopTargetMovement();
  movementInterval = setInterval(()=>{
    targetSpeed = baseTargetSpeed;
    targetPos += targetDirection * targetSpeed;
    if (targetPos <= 0.03) { targetPos = 0.03; targetDirection = 1; }
    if (targetPos + targetWidth >= 0.97) { targetPos = 0.97 - targetWidth; targetDirection = -1; }
    if (Math.random() < 0.04) targetDirection *= -1;
    updateTargetUI();
  }, moveTickMs);
}
function stopTargetMovement(){
  if (movementInterval){ clearInterval(movementInterval); movementInterval = null; }
}

/* knob drag/touch handling */
function startDrag(e){ dragging = true; e.preventDefault(); }
function endDrag(e){ dragging = false; }
function onMove(e){
  if (!dragging) return;
  const ev = e.touches ? e.touches[0] : e;
  const p = pointToPercent(ev.pageX);
  setKnobByPercent(p);
  e.preventDefault();
}

knob.addEventListener('mousedown', startDrag);
knob.addEventListener('touchstart', startDrag, {passive:false});
window.addEventListener('mouseup', endDrag);
window.addEventListener('touchend', endDrag);
window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', onMove, {passive:false});

/* buttons */
startBtn.addEventListener('click', ()=>{
  gameOverEl.style.display = 'none';
  defusedBox.style.display = 'none';
  document.body.classList.remove('flash');
  if (audioCtx.state === 'suspended') audioCtx.resume();
  startTimer();
});

defuseBtn.addEventListener('click', ()=>{
  if (!running) { statusEl.textContent = 'Inicie o timer primeiro.'; return; }
  if (defused) return;
  showMiniGame();
});

/* input change */
timeInput.addEventListener('input', ()=>{
  const v = Number(timeInput.value) || 0;
  if (v < 10) timeInput.value = 10;
  updateTimerUI();
});

/* observer: hide mini-game on game over */
const obs = new MutationObserver(()=> { if (gameOverEl.style.display === 'flex') hideMiniGame(); });
obs.observe(gameOverEl, {attributes:true, childList:true, subtree:true});

/* initial UI */
updateTimerUI();

/* prevent gesture zoom */
document.addEventListener('gesturestart', e => e.preventDefault());
</script>

</body>
</html>
